[project]
name = "nowigetit"
version = "0.1.0"
description = "Explain concepts as Manim videos with LLM scene planning, VLM review, and TTS"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.55.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.8.0",
  "supabase>=2.10.0",
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
  "setuptools>=70.0.0; python_version >= '3.12'",
  "manim>=0.18.0",
  "manimgl>=1.7.0",
  "imageio>=2.31.0",
  "imageio-ffmpeg>=0.4.9",
  "scipy>=1.11.0",
  "pycairo>=1.24.0",
  "manimpango>=0.5.0",
  "PyOpenGL>=3.1.0",
  "moderngl>=5.8.0",
]

[project.optional-dependencies]
manim = [
  "manim>=0.18.0",
  "manimgl>=1.7.0",
  "imageio>=2.31.0",
  "imageio-ffmpeg>=0.4.9",
  "scipy>=1.11.0",
  "pycairo>=1.24.0",
  "manimpango>=0.5.0",
  "PyOpenGL>=3.1.0",
  "moderngl>=5.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "api"]

