[project]
name = "nowigetit"
version = "0.1.0"
description = "Explain concepts as Manim videos with LLM scene planning, VLM review, and TTS"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.55.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.8.0",
  "pymongo>=4.10.0",
  "supabase>=2.10.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "setuptools>=70.0.0; python_version >= '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "api"]
